# Source: https://github.com/caticat/live2d-companion-page
# Sync trigger: source 05554d2
name: Deploy Live2D companion page

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/deploy-live2d.yml
  workflow_dispatch:
  repository_dispatch:
    types:
      - deploy-live2d
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: github-pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v6
        with:
          path: target

      - name: Checkout Live2D source repository
        uses: actions/checkout@v6
        with:
          repository: caticat/live2d-companion-page
          ref: master
          path: source
          persist-credentials: false

      - name: Replace published site
        run: |
          find target -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            -exec rm -rf {} +
          cp source/index.html source/notes.html source/404.html target/
          cp source/README.md target/
          cp -R source/src source/public source/docs target/
          touch target/.nojekyll

      - name: Commit published files
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Published site is already up to date."
            exit 0
          fi
          git commit -m "Deploy Live2D companion page"
          git push
