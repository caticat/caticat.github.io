# Source: https://github.com/caticat/live2d-companion-page
name: Deploy Live2D companion page

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/deploy-live2d.yml
  workflow_dispatch:
  repository_dispatch:
    types:
      - deploy-live2d
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Live2D source repository
        uses: actions/checkout@v6
        with:
          repository: caticat/live2d-companion-page
          ref: master

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html _site/
          cp -R src public docs _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
