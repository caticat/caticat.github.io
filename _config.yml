# Archived Hexo configuration
# This branch is retained for historical reference and is no longer deployed.

# Site
title: 杂记
subtitle: 不乱
description:
keywords:
author: Pan
language: zh-CN
timezone:

# URL
url: https://caticat.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  filed: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace:

index_generator:
  path: ''
  per_page: 10
  order_by: -date

default_category: uncategorized
category_map:
tag_map:

date_format: YYYY-MM-DD
time_format: HH:mm:ss
per_page: 10
pagination_dir: page

theme: next

# Deployment is disabled. The current site is deployed from
# caticat/live2d-companion-page.
deploy:
  type:

# Legacy LeanCloud credentials were removed from the branch tip.
# Previously exposed credentials must still be revoked in LeanCloud.
leancloud_counter_security:
  enable_sync: false
  app_id: REVOKED
  app_key: REVOKED
  username: REVOKED
  password: REVOKED

search:
  path: search.xml
  field: post
  format: html
  limit: 10000

sitemap:
  path: sitemap.xml
baidusitemap:
  path: baidusitemap.xml

live2d:
  enable: true
  pluginModelPath: assets/
  model:
    use: live2d-widget-model-haru/01
  display:
    position: right
    width: 150
    height: 300
  mobile:
    show: false
